<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-bg future-theme">
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="toast-wrap">
      {% for category, message in messages %}
        <div class="toast {{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}


  <div class="auth-wrap">
    <div class="auth-card hover-soft futureshine-auth" style="grid-template-columns:1fr;">
      <span class="section-label">New Access</span>
      <h1>Create Account</h1>
      <p class="muted">Register your role to continue into the PM Internship platform.</p>

      <form class="form" method="POST" action="/signup">
        <label>Register As</label>
        <select name="role" required>
          <option value="">Select Role</option>
          <option value="seeker">Intern Seeker</option>
          <option value="company">Company</option>
          <option value="admin">Admin</option>
        </select>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button class="btn btn-primary full" type="submit">Create Account</button>
        <a class="btn btn-outline full" href="/login">Back to Login</a>
      </form>
    </div>
  </div>

</body>
</html>
